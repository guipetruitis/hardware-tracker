    function switchTab(tabId) {

        document.getElementById('content-login').classList.remove('active');
        document.getElementById('content-register').classList.remove('active');

        // Activate selected
        if (tabId === 'login') {
            document.getElementById('tab-login').className = "flex-1 py-4 text-center font-medium text-primary-container border-b-2 border-primary-container focus:outline-none transition-colors";
